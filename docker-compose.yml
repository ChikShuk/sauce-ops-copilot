services:
  db:
    image: postgres:16-alpine
    container_name: sauce-ops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sauce
      POSTGRES_PASSWORD: sauce
      POSTGRES_DB: sauce_ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauce -d sauce_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: